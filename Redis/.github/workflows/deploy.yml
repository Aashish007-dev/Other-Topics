name: CD — Test & Deploy

on:
  push:
    branches: [main]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Redis

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-dam0bnff3r2c73e0ek6g?key=GO0ApbbII8Q"